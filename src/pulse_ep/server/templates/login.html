<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Ultimate · Sign In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <i class="fas fa-heartbeat"></i>
      <h1>Pulse <span>Ultimate</span></h1>
    </div>

    <div id="error-msg" class="hidden" style="
      background: var(--danger-dim); color: var(--danger);
      border-radius: var(--r-sm); padding: 9px 12px;
      font-size: 13px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
      <i class="fas fa-exclamation-circle"></i>
      <span id="error-text">Invalid credentials</span>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary btn-full" id="submitBtn">
        Sign In
      </button>
    </form>

    <p class="auth-footer">No account yet? <a href="/register">Register</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errBox = document.getElementById('error-msg');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errBox.classList.add('hidden');

      try {
        const response = await fetch('/login_user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        if (response.ok) {
          const data = await response.json();
          localStorage.setItem('token', data.access_token);
          window.location.href = '/dashboard';
        } else {
          errBox.classList.remove('hidden');
          document.getElementById('error-text').textContent = 'Invalid username or password.';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (err) {
        errBox.classList.remove('hidden');
        document.getElementById('error-text').textContent = 'Connection error. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
