site_name: pulse-ep
site_description: Open-source platform for programmatic access to CARTO 3 and EnSiteX electroanatomical mapping data.
site_author: Sven Willert
site_url: https://sw.gitlab-pages.willert.net/pulse-ep/
repo_name: gitlab.willert.net/sw/pulse-ep
repo_url: https://gitlab.willert.net/sw/pulse-ep
edit_uri: -/edit/main/docs/
copyright: Copyright © 2026 Sven Willert — MIT License

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/gitlab
    edit: material/pencil

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: false
            heading_level: 2
            members_order: source
            separate_signature: true
            line_length: 88
            merge_init_into_class: true
            docstring_style: numpy
            docstring_section_style: spacy
            filters:
              - "!^_"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - docs
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.willert.net/sw/pulse-ep
      name: pulse-ep on GitLab
  generator: false

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Guides:
      - Importing CARTO studies: guides/carto-import.md
      - Importing EnSite X studies: guides/ensite-import.md
      - Masking and interpolation: guides/interpolation.md
      - The web viewer: guides/web-viewer.md
      - The MCP server: guides/mcp.md
      - Docker deployment: guides/docker-deployment.md
      - Managing users: guides/managing-users.md
      - Colormaps and reports: guides/colormaps-and-reports.md
  - Reference:
      - REST API: reference/rest-api.md
      - Command-line tools: reference/cli.md
      - Python API: reference/python-api.md
      - Data model: reference/data-model.md
      - Configuration reference: reference/configuration.md
  - Examples:
      - Overview: examples/index.md
  - Architecture: architecture.md
  - Contributing: contributing.md
  - Release process: release-process.md
  - Changelog: changelog.md
