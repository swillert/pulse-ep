[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-ep"
version = "0.1.0"
description = "Open-source platform for programmatic access to CARTO electroanatomical mapping data — REST API, 3D viewer, and Python toolkit for cardiac electrophysiology research."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "electrophysiology",
    "cardiology",
    "pace-mapping",
    "CARTO",
    "electroanatomical-mapping",
    "mesh-analysis",
    "open-source",
]
authors = [
    { name = "Sven Willert", email = "sw@willert.net" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "pyvista>=0.44,<1",
    "vtk>=9.4,<10",
    "trimesh>=4.5,<5",
    "pymeshfix>=0.17,<1",
    "pycollada>=0.8,<1",
    "lxml>=5.3,<6",
    "SQLAlchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "pillow>=11.0,<12",
    "pandas>=2.0,<3",
    "chardet>=5,<6",        # encoding detection for CARTO mesh files
    "joblib>=1.3,<2",       # parallel mesh ops in mesh_proc (also pulled by sklearn)
    "requests>=2.30,<3",    # cli/check_mesh
]
# Note: potpourri3d (Heat Method via geometry-central) is intentionally NOT here.
# It belongs to pulse-ep-decay, the scientific extension package.

[project.optional-dependencies]
server = [
    "Flask>=3.1,<4",
    "Flask-Bcrypt>=1.0,<2",
    "Flask-Cors>=5.0,<6",
    "Flask-JWT-Extended>=4.7,<5",
    "bcrypt>=4.2,<5",
    "gunicorn>=23.0,<24",
]
figures = [
    "reportlab>=4.2,<5",
    "openpyxl>=3.1,<4",
    "simplekml>=1.3,<2",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]
all = [
    "pulse-ep[server,figures,dev]",
]

[project.urls]
Homepage = "https://gitlab.willert.net/sw/pulse-ep"
Repository = "https://gitlab.willert.net/sw/pulse-ep"
Issues = "https://gitlab.willert.net/sw/pulse-ep/-/issues"
Documentation = "https://gitlab.willert.net/sw/pulse-ep#readme"
"Scientific extension" = "https://gitlab.willert.net/sw/pulse-ep-decay"

[project.scripts]
# Platform commands — data import, server, utilities.
# Scientific analysis commands (spatial-decay, validate-sigma, etc.) live in pulse-ep-decay.
pulse-ep-import-carto = "pulse_ep.cli.import_carto:main"
pulse-ep-extract-meshes = "pulse_ep.cli.extract_meshes_for_validation:main"
pulse-ep-tag-maps = "pulse_ep.cli.tag_maps:main"
pulse-ep-populate-colormaps = "pulse_ep.cli.populate_colormaps:main"
pulse-ep-check-mesh = "pulse_ep.cli.check_mesh:main"
pulse-ep-create-user = "pulse_ep.cli.create_user:main"
pulse-ep-demo = "pulse_ep.examples.demo_synthetic:main"
pulse-ep-server = "pulse_ep.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pulse_ep*"]

[tool.setuptools.package-data]
"pulse_ep.server" = ["static/**/*", "templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
