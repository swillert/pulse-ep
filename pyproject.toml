[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-ep"
version = "0.4.1"
description = "Open-source platform for programmatic access to CARTO 3 and EnSiteX electroanatomical mapping data — REST API, 3D viewer, and Python toolkit for cardiac electrophysiology research."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "electrophysiology",
    "cardiology",
    "pace-mapping",
    "CARTO",
    "EnSite",
    "multivendor",
    "electroanatomical-mapping",
    "mesh-analysis",
    "open-source",
]
authors = [
    { name = "Sven Willert", email = "sw@willert.net" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Upper bounds admit the current major of each dependency and exclude the
# next one. Capping *below* a released major — as pyarrow<21 did — makes the
# package uninstallable on newer Pythons, which only ship wheels for recent
# releases: a fresh install on Python 3.14 failed trying to build pyarrow
# from source.
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "pyvista>=0.44,<1",
    "vtk>=9.4,<10",
    "trimesh>=4.5,<6",
    "pymeshfix>=0.17,<1",
    "pycollada>=0.8,<1",
    "lxml>=5.3,<7",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",     # database schema migrations
    "psycopg2-binary>=2.9,<3",
    "pillow>=11.0,<13",
    "pandas>=2.0,<4",
    "pyarrow>=16,<26",      # Parquet/Arrow waveform storage (cross-language: R/MATLAB/…)
    "chardet>=5,<6",        # encoding detection for CARTO mesh files
    "joblib>=1.3,<2",       # parallel mesh ops in mesh_proc (also pulled by sklearn)
    "requests>=2.30,<3",    # cli/check_mesh
    "pydantic>=2.7,<3",          # typed config (Settings) + future API models
    "pydantic-settings>=2.5,<3", # 12-factor config loader for PULSE_EP_* env vars
]

[project.optional-dependencies]
server = [
    "Flask>=3.1,<4",
    "Flask-Bcrypt>=1.0,<2",
    "Flask-Cors>=5.0,<6",
    "Flask-JWT-Extended>=4.7,<5",
    "bcrypt>=4.2,<5",
    "gunicorn>=23.0,<24",
]
sevenzip = [
    "py7zr>=0.21,<2",   # CARTO exports are often 7-Zip archives named .zip
]
mcp = [
    "mcp>=1.2,<2",      # MCP server; the REST client itself needs only requests
]
figures = [
    "reportlab>=4.2,<5",
    "openpyxl>=3.1,<4",
    "simplekml>=1.3,<2",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff==0.16.6",      # exact: a formatter's output changes between versions
    "mypy>=1.10,<2",
]
docs = [
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.26,<1",
    "mkdocs-include-markdown-plugin>=7.0,<8",
    "pymdown-extensions>=10.9,<11",
]
all = [
    "pulse-ep[server,figures,sevenzip,mcp,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/swillert/pulse-ep"
Repository = "https://github.com/swillert/pulse-ep"
Issues = "https://github.com/swillert/pulse-ep/issues"
Documentation = "https://github.com/swillert/pulse-ep/tree/main/docs"

[project.scripts]
pulse-ep-import-carto = "pulse_ep.cli.import_carto:main"
pulse-ep-import-ensite = "pulse_ep.cli.import_ensite:main"
pulse-ep-extract-meshes = "pulse_ep.cli.extract_meshes_for_validation:main"
pulse-ep-tag-maps = "pulse_ep.cli.tag_maps:main"
pulse-ep-populate-colormaps = "pulse_ep.cli.populate_colormaps:main"
pulse-ep-check-mesh = "pulse_ep.cli.check_mesh:main"
pulse-ep-create-user = "pulse_ep.cli.create_user:main"
pulse-ep-demo = "pulse_ep.examples.demo_synthetic:main"
pulse-ep-server = "pulse_ep.server.app:main"
pulse-ep-init = "pulse_ep.cli.init:main"
pulse-ep-migrate = "pulse_ep.cli.migrate:main"
pulse-ep-mcp = "pulse_ep.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pulse_ep*"]

[tool.setuptools.package-data]
"pulse_ep.server" = ["static/**/*", "templates/**/*"]
# Migrations must ship: without them a pip-installed deployment can
# never upgrade its database, which the additive-migration promise needs.
"pulse_ep.migrations" = ["*.py", "*.mako", "versions/*.py", "README"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "*.ipynb",              # client-facing notebooks intentionally use a different style
    "*.md",                 # docs snippets are wrapped for reading, not compiled
    "src/pulse_ep/migrations/versions",  # autogenerated migrations
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
# "publication" holds the figure-reproduction test: a paper figure that
# can no longer be generated by the published code is a broken claim,
# so it is gated like any other test.
testpaths = ["tests", "publication"]
python_files = ["test_*.py"]
addopts = "-ra -q"
