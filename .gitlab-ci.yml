# GitLab CI for pulse-ep
#
# Stages:
#   lint  -> ruff format + check
#   test  -> Python matrix 3.10 … 3.14, pytest
#   pages -> mkdocs-material site, deployed to GitLab Pages
#
# The test job installs pulse-ep with the [server,figures,sevenzip,dev] extras
# so the demo / EPMap tests have pyvista, vtk and matplotlib, and the 7-Zip
# import tests actually run instead of skipping.

stages:
  - lint
  - test
  - pages
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PYTHONDONTWRITEBYTECODE: "1"

.python_setup: &python_setup
  before_script:
    - python -V
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip wheel
  cache:
    # The prefix is what makes this cache correct, not merely faster. Keyed on
    # pyproject.toml alone, all eight jobs shared one entry holding a `.venv/`,
    # and they do not run the same interpreter or install the same thing:
    #
    #   - Six Python versions (3.10 … 3.14, plus 3.12-slim) took turns
    #     restoring each other's venv. `lib/python3.1x/site-packages` never
    #     matched, so pip reinstalled everything from scratch every time and
    #     then uploaded a bigger venv — the cache cost time instead of saving
    #     it, and each job in the matrix ran slower than the one before.
    #   - Worse, verify:fixtures exists to prove a *bare* install can read an
    #     export. It could restore the venv test:py3.12 had just filled with
    #     every extra, and pass on dependencies its own install never pulled —
    #     silently unable to catch the one regression it is there for.
    #
    # Per job, still keyed on pyproject.toml so a dependency change invalidates.
    key:
      files:
        - pyproject.toml
      prefix: "$CI_JOB_NAME_SLUG"
    paths:
      - .pip-cache/
      - .venv/

ruff:
  stage: lint
  image: python:3.12-slim
  <<: *python_setup
  script:
    # Pinned to match pyproject [dev] and .pre-commit-config.yaml — an
    # unpinned range let CI format-check with a different ruff than
    # contributors ran, so the gate failed on untouched files.
    - pip install "ruff==0.16.6"
    - ruff check .
    - ruff format --check .

.test_template: &test_template
  stage: test
  <<: *python_setup
  script:
    # System libs that pyvista/vtk and matplotlib's headless backend need.
    # libosmesa6 is what makes off-screen rendering possible at all — the
    # publication figure test renders, and without it VTK segfaults.
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libglu1-mesa libosmesa6 libxrender1 libsm6 libxext6 libfontconfig1 libxkbcommon0
    - pip install -e ".[server,figures,sevenzip,mcp,dev]"
    - pytest -v --maxfail=5
  coverage: '/^TOTAL.*?(\d+\%)$/'

test:py3.10:
  image: python:3.10
  <<: *test_template

test:py3.11:
  image: python:3.11
  <<: *test_template

test:py3.12:
  image: python:3.12
  <<: *test_template

test:py3.13:
  image: python:3.13
  <<: *test_template

test:py3.14:
  image: python:3.14
  <<: *test_template

# ---------------------------------------------------------------------
# The verification script users are told to run
# ---------------------------------------------------------------------
#
# `tests/test_synthetic_fixtures.py` already checks the fixtures in every
# Python version of the matrix. This job checks the *script* from the README
# instead — installed package, no repo checkout assumptions, no dev extras —
# so a broken `examples/verify.sh` fails here rather than for a first-time
# user following the quickstart. Deliberately a bare install with no extras:
# reading an export must not require the server or figure dependencies.
verify:fixtures:
  stage: test
  image: python:3.12
  <<: *python_setup
  script:
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libglu1-mesa libosmesa6 libxrender1 libsm6 libxext6 libfontconfig1 libxkbcommon0
    - pip install -e "."
    - PYTHON=.venv/bin/python examples/verify.sh

# ---------------------------------------------------------------------
# Documentation site: mkdocs-material → GitLab Pages
# ---------------------------------------------------------------------
#
# The mkdocstrings plugin imports pulse_ep at build time to extract
# docstrings, so we install the package itself (slim — no server/figures
# extras needed for doc generation) plus the [docs] extra.
pages:
  stage: pages
  image: python:3.12-slim
  <<: *python_setup
  script:
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libxrender1
    - pip install -e ".[docs]"
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------
# GitHub mirror — required for SoftwareX submission (open-access repo)
# and for the Zenodo-on-GitHub release / DOI workflow.
# ---------------------------------------------------------------------
#
# Mirrors main and tags to GitHub on every
# push to `main` and on every tag. Authentication uses two protected,
# masked CI variables that must be set in GitLab → Settings → CI/CD:
#
#   GITHUB_USER   — GitHub username that owns the mirror repo
#   GITHUB_TOKEN  — Personal access token with `repo` scope
#
# The GitHub repository is github.com/${GITHUB_USER}/pulse-ep and must
# exist (empty, no auto-initialised README) before the first run.
mirror_to_github:
  stage: deploy
  # alpine/git ships with `git` as the container ENTRYPOINT, which
  # breaks the way GitLab CI launches scripts (`<entrypoint> sh -c
  # "<commands>"` becomes `git sh -c "..."` and git rejects `sh`).
  # Override the entrypoint to make it behave like a normal image.
  image:
    name: alpine/git:latest
    entrypoint: [""]
  # Run immediately, in parallel with lint / test / pages. The mirror
  # is content-agnostic — whether the tests pass or not has no bearing
  # on whether GitLab and GitHub should hold the same commit.
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"   # fetch full history so all commits/tags propagate
  before_script:
    - git config --global user.email "ci@willert.net"
    - git config --global user.name "GitLab CI (pulse-ep)"
  script:
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://${GITHUB_USER}:${GITHUB_TOKEN}@github.com/${GITHUB_USER}/pulse-ep.git"
    - git fetch origin --tags
    - |
      if [ -n "$CI_COMMIT_BRANCH" ]; then
        # Push what origin/main points at *now*, not this pipeline's HEAD, and
        # never with --force. Jobs are not ordered: with one runner an older
        # pipeline can reach this job after a newer one has already mirrored.
        # Forcing its own HEAD then rewinds the public branch — on 2026-09-07
        # pipeline #510 (1c1bc08) undid #512 (7660bee) that way, and the two
        # commits were missing from GitHub until the next push. Without
        # --force a stale push is refused instead of destroying history.
        git fetch origin main
        git push github "FETCH_HEAD:refs/heads/main"
      fi
    - git push github --tags
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
