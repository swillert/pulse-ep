# GitLab CI for pulse-ep
#
# Stages: lint -> test (Python matrix 3.10 / 3.11 / 3.12)
#
# The test job installs pulse-ep with the [server,figures,dev] extras so
# the demo / EPMap tests have pyvista, vtk and matplotlib available. The
# server extra is pulled in to keep the test path realistic; if it ever
# slows builds significantly, split it into a dedicated server-tests job.

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PYTHONDONTWRITEBYTECODE: "1"

.python_setup: &python_setup
  before_script:
    - python -V
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip wheel
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .pip-cache/
      - .venv/

ruff:
  stage: lint
  image: python:3.12-slim
  <<: *python_setup
  script:
    - pip install "ruff>=0.6,<1"
    - ruff check .
    - ruff format --check .

.test_template: &test_template
  stage: test
  <<: *python_setup
  script:
    # System libs that pyvista/vtk and matplotlib's headless backend need.
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libglu1-mesa libxrender1 libsm6 libxext6 libfontconfig1 libxkbcommon0
    - pip install -e ".[server,figures,dev]"
    - pytest -v --maxfail=5
  coverage: '/^TOTAL.*?(\d+\%)$/'

test:py3.10:
  image: python:3.10
  <<: *test_template

test:py3.11:
  image: python:3.11
  <<: *test_template

test:py3.12:
  image: python:3.12
  <<: *test_template
