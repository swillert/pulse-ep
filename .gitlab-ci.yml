# GitLab CI for pulse-ep
#
# Stages:
#   lint  -> ruff format + check
#   test  -> Python matrix 3.10 … 3.14, pytest
#   pages -> mkdocs-material site, deployed to GitLab Pages
#
# The test job installs pulse-ep with the [server,figures,sevenzip,dev] extras
# so the demo / EPMap tests have pyvista, vtk and matplotlib, and the 7-Zip
# import tests actually run instead of skipping.

stages:
  - lint
  - test
  - pages
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PYTHONDONTWRITEBYTECODE: "1"

.python_setup: &python_setup
  before_script:
    - python -V
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip wheel
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .pip-cache/
      - .venv/

ruff:
  stage: lint
  image: python:3.12-slim
  <<: *python_setup
  script:
    # Pinned to match pyproject [dev] and .pre-commit-config.yaml — an
    # unpinned range let CI format-check with a different ruff than
    # contributors ran, so the gate failed on untouched files.
    - pip install "ruff==0.16.6"
    - ruff check .
    - ruff format --check .

.test_template: &test_template
  stage: test
  <<: *python_setup
  script:
    # System libs that pyvista/vtk and matplotlib's headless backend need.
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libglu1-mesa libxrender1 libsm6 libxext6 libfontconfig1 libxkbcommon0
    - pip install -e ".[server,figures,sevenzip,dev]"
    - pytest -v --maxfail=5
  coverage: '/^TOTAL.*?(\d+\%)$/'

test:py3.10:
  image: python:3.10
  <<: *test_template

test:py3.11:
  image: python:3.11
  <<: *test_template

test:py3.12:
  image: python:3.12
  <<: *test_template

test:py3.13:
  image: python:3.13
  <<: *test_template

test:py3.14:
  image: python:3.14
  <<: *test_template

# ---------------------------------------------------------------------
# Documentation site: mkdocs-material → GitLab Pages
# ---------------------------------------------------------------------
#
# The mkdocstrings plugin imports pulse_ep at build time to extract
# docstrings, so we install the package itself (slim — no server/figures
# extras needed for doc generation) plus the [docs] extra.
pages:
  stage: pages
  image: python:3.12-slim
  <<: *python_setup
  script:
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libxrender1
    - pip install -e ".[docs]"
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------
# GitHub mirror — required for SoftwareX submission (open-access repo)
# and for the Zenodo-on-GitHub release / DOI workflow.
# ---------------------------------------------------------------------
#
# Force-pushes all branches and tags to the GitHub mirror on every
# push to `main` and on every tag. Authentication uses two protected,
# masked CI variables that must be set in GitLab → Settings → CI/CD:
#
#   GITHUB_USER   — GitHub username that owns the mirror repo
#   GITHUB_TOKEN  — Personal access token with `repo` scope
#
# The GitHub repository is github.com/${GITHUB_USER}/pulse-ep and must
# exist (empty, no auto-initialised README) before the first run.
mirror_to_github:
  stage: deploy
  # alpine/git ships with `git` as the container ENTRYPOINT, which
  # breaks the way GitLab CI launches scripts (`<entrypoint> sh -c
  # "<commands>"` becomes `git sh -c "..."` and git rejects `sh`).
  # Override the entrypoint to make it behave like a normal image.
  image:
    name: alpine/git:latest
    entrypoint: [""]
  # Run immediately, in parallel with lint / test / pages. The mirror
  # is content-agnostic — whether the tests pass or not has no bearing
  # on whether GitLab and GitHub should hold the same commit.
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"   # fetch full history so all commits/tags propagate
  before_script:
    - git config --global user.email "ci@willert.net"
    - git config --global user.name "GitLab CI (pulse-ep)"
  script:
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://${GITHUB_USER}:${GITHUB_TOKEN}@github.com/${GITHUB_USER}/pulse-ep.git"
    - git fetch origin --tags
    - git push github "HEAD:refs/heads/main" --force
    - git push github --tags --force
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
