# =============================================================================
# pulse-ep — Docker Compose stack
# -----------------------------------------------------------------------------
# Three services, separated by profile so you only pay for what you use:
#
#   default profile  →  postgres        (always started)
#   server   profile →  pulse-ep server (built from local Dockerfile)
#   admin    profile →  pgAdmin 4       (web UI for Postgres)
#
# Usage:
#   cp .env.example .env
#   docker compose up -d                            # Postgres only
#   docker compose --profile server up -d --build   # + server
#   docker compose --profile admin  up -d           # + pgAdmin on :8080
#   docker compose --profile server --profile admin up -d --build
#
# Stop & remove (data preserved):     docker compose down
# Stop & wipe DB volume:              docker compose down -v
# =============================================================================

name: pulse-ep

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulse-ep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
      # Speed up startup on dev hardware by skipping locale generation.
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pulse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse} -d ${POSTGRES_DB:-pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    profiles: ["server"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-ep-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Override the host/port the API binds to *inside* the container.
      # The .env file (below) supplies database/JWT credentials.
      PULSE_EP_HOST: "0.0.0.0"
      PULSE_EP_PORT: "5000"
      PULSE_EP_REPORTS_DIR: /var/lib/pulse-ep/reports
      PULSE_EP_WAVEFORM_STORE_DIR: /var/lib/pulse-ep/waveforms
      PULSE_EP_DROP_DIR: /var/lib/pulse-ep/drop
      # Compose the DB URL from the same Postgres credentials used above,
      # so the developer only has to maintain one set of variables.
      PULSE_EP_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse}@postgres:5432/${POSTGRES_DB:-pulse}
    env_file:
      - path: .env
        required: false
    ports:
      - "${PULSE_EP_HOST_PORT:-5000}:5000"
    volumes:
      # Persist generated Excel reports outside the container lifecycle.
      - pulse-reports:/var/lib/pulse-ep/reports
      - pulse-waveforms:/var/lib/pulse-ep/waveforms
      - pulse-drop:/var/lib/pulse-ep/drop
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:5000/\", timeout=2); sys.exit(0)'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    profiles: ["admin"]
    image: dpage/pgadmin4:latest
    container_name: pulse-ep-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - pulse-pgadmin:/var/lib/pgadmin

volumes:
  pulse-pgdata:
    name: pulse-ep-pgdata
  pulse-reports:
    name: pulse-ep-reports
  pulse-pgadmin:
    name: pulse-ep-pgadmin
  pulse-waveforms:
    name: pulse-ep-waveforms
  pulse-drop:
    name: pulse-ep-drop
